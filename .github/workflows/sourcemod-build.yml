name: SourceMod Build

on:
  push:
    paths:
      - .github/workflows/sourcemod-build.yml
      - scripts/ci-build-sourcemod.sh
      - sourcemod/**
  pull_request:
    paths:
      - .github/workflows/sourcemod-build.yml
      - scripts/ci-build-sourcemod.sh
      - sourcemod/**
  workflow_dispatch:
    inputs:
      sourcemod_version:
        description: SourceMod version to download
        required: false
        default: "1.12"

concurrency:
  group: sourcemod-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCEMOD_VERSION: ${{ github.event.inputs.sourcemod_version || '1.12' }}
  SOURCEMOD_ARCHIVE_URL: https://www.sourcemod.net/latest.php?os=linux&version=${{ github.event.inputs.sourcemod_version || '1.12' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install SourceMod build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl tar

      - name: Show SourceMod version
        run: |
          echo "SOURCEMOD_VERSION=${SOURCEMOD_VERSION}"
          echo "SOURCEMOD_ARCHIVE_URL=${SOURCEMOD_ARCHIVE_URL}"

      - name: Resolve artifact name
        id: artifact
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME//\//-}"
          echo "name=steamidtools-sourcemod-ci-${ref_name}" >> "$GITHUB_OUTPUT"

      - name: Compile SourceMod plugin
        run: bash ./scripts/ci-build-sourcemod.sh

      - name: Upload SourceMod CI artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/sourcemod/artifact/addons/**

name: SourcePawn tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: sourcepawn-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@v6
      - name: Install pkg_resources for the pinned SourcePawn configure script
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-pkg-resources
      - name: Prepare SourceMod compiler and standalone SourcePawn VM
        run: make deps-test
      - name: Run SourcePawn tests
        run: make test

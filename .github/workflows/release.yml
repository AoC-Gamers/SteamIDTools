name: Release
on:
  push:
    branches: [main, develop]
    tags: ['sourcemod/v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve release
        id: release
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/sourcemod/v*)
              bash scripts/ci-resolve-release.sh "$GITHUB_REF_NAME"
              git fetch origin main
              git merge-base --is-ancestor "$GITHUB_SHA" origin/main
              echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#sourcemod/v}" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/main)
              echo "tag=channel/latest" >> "$GITHUB_OUTPUT"
              echo "version=latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/develop)
              echo "tag=channel/develop" >> "$GITHUB_OUTPUT"
              echo "version=develop" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
      - name: Build and validate offline toolkit
        run: |
          make deps-smx build-smx
          python3 scripts/test-sourcepawn-offline.py --prepare-vm
          make test-offline
          make package-smx
          python3 scripts/stage-artifact.py . .build/package-smx deps/build-toolkit.log
          bash scripts/ci-validate-artifact.sh
          make check-package
          make release-smx SMX_RELEASE_BASENAME=steamidtools-sourcemod-${{ steps.release.outputs.version }}
      - name: Publish SourceMod asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          asset="dist/release/steamidtools-sourcemod-${RELEASE_VERSION}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          else
            options=()
            if [[ "$PRERELEASE" == true ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "$asset" --target "$GITHUB_SHA" --title "SteamIDTools ${RELEASE_VERSION}" --generate-notes "${options[@]}"
          fi
